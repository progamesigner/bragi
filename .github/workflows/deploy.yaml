---
name: Deploy

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: ${{ env.NODE_VERSION }}
      - name: Install
        run: npm ci
      - name: Check
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      # Screenshot baselines are rendered with the system Noto CJK faces.
      - name: Install fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
      - name: Build
        env:
          NITRO_PRESET: cloudflare_module
        run: |
          npm run build
          test -s .output/public/sw.js
      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy --message "${GITHUB_SHA::7}"
      - name: Upload preview
        # Dependabot runs cannot read repository secrets, so they only build and test.
        if: github.ref != 'refs/heads/main' && github.actor != 'dependabot[bot]'
        env:
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          alias=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-' | tr -s '-')
          alias=${alias#-}
          [[ $alias =~ ^[a-z] ]] || alias="b-$alias"
          alias=${alias:0:40}
          alias=${alias%-}
          npx wrangler versions upload --preview-alias "$alias" \
            --message "$BRANCH ${GITHUB_SHA::7}" | tee upload.log
          url=$(grep -oE "https://$alias-[^ ]+\.workers\.dev" upload.log | tail -1 || true)
          echo "Preview: ${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"
