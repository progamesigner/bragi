name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # Screenshot baselines are rendered with the system Noto CJK faces.
      - run: sudo apt-get install -y fonts-noto-cjk
      - run: npm run test:e2e
      - name: Build Vercel deployment assets
        run: |
          npm run build
          test -s .vercel/output/static/sw.js
        env:
          NITRO_PRESET: vercel
          VERCEL: "1"
          VERCEL_ENV: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
