<!doctype html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Audio controller browser tests</title></head>
<body>
  <h1>Audio controller browser tests</h1>
  <button type="button" id="cached">Cached WAV</button>
  <button type="button" id="prefetch">Preload WAV</button>
  <button type="button" id="prefetched">Play preloaded WAV</button>
  <button type="button" id="pcm">Stream PCM</button>
  <button type="button" id="rate">Generate WAV 1.5x</button>
  <button type="button" id="pause">Pause</button>
  <button type="button" id="resume">Resume</button>
  <button type="button" id="interrupt">Suspend context</button>
  <button type="button" id="sample">Sample owner</button>
  <button type="button" id="stop">Stop</button>
  <button type="button" id="reject">Reject next content play</button>
  <button type="button" id="fail">Fail next stream</button>
  <button type="button" id="hold">Delay context resume</button>
  <label>Seek <input id="seek" type="range" min="0" max="11" step="0.25" disabled /></label>
  <pre id="snapshot"></pre><pre id="policy"></pre><pre id="events"></pre>
  <script type="module" src="/harness.ts"></script>
</body>
</html>
